name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o LordsOfThePokerRoomNative.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: LordsOfThePokerRoomNative
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp LordsOfThePokerRoomNative/app/build/outputs/apk/debug/app-debug.apk \
             output/Lords-of-the-Poker-Room.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lords-of-the-Poker-Room-APK
          path: output/Lords-of-the-Poker-Room.apk
